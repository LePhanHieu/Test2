name: Quality checks

on:
  push:
    branches: [feature/real-data-bootstrap, "refactor/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: sqlite:///${{ runner.temp }}/dermascan-test.db
      SECRET_KEY: isolated-ci-test-secret-not-for-production
      COVERAGE_FILE: ${{ runner.temp }}/dermascan.coverage
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt pytest-cov
      - name: Run isolated pytest suite
        run: |
          python -m pytest tests/ -q -p no:cacheprovider --basetemp="${RUNNER_TEMP}/dermascan-pytest" --cov=skin_cancer.webapp --cov-report=term-missing:skip-covered

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install ruff bandit
      - name: Block critical lint errors in tests
        run: ruff check tests/ --select E4,E7,E9,F821 --no-cache
      - name: Block undefined backend names
        run: ruff check skin_cancer/webapp --select F821 --no-cache
      - name: Report legacy backend lint (non-blocking)
        run: ruff check skin_cancer/webapp --select E4,E7,E9,F --no-cache --exit-zero
      - name: Report formatting debt (non-blocking)
        run: ruff format --check skin_cancer/webapp || test "$?" -eq 1
      - name: Report security findings (non-blocking)
        run: bandit -r skin_cancer/webapp -q --exit-zero
